name: live

# Plugin suites that talk to real services with real credentials. Never on
# pull_request: the code under test would run with the secrets. Every job that
# reads one names the `live-tests` environment, which only `main` may use.
# A suite whose secret is missing fails rather than skips, so a green run
# always means the service was reached.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  matters:
    name: matters (matters.icu)
    runs-on: ubuntu-latest
    environment: live-tests
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plugins/matters
    steps:
      - name: Require the test wallet
        env:
          KEY: ${{ secrets.MATTERS_TEST_WALLET_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::MATTERS_TEST_WALLET_PRIVATE_KEY is not set in the live-tests environment; see plugins/matters/test-helpers/TEST_ACCOUNT.md."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run the features suite against matters.icu
        env:
          MATTERS_TEST_WALLET_PRIVATE_KEY: ${{ secrets.MATTERS_TEST_WALLET_PRIVATE_KEY }}
        run: npm run test:features

  github:
    name: github (api.github.com)
    runs-on: ubuntu-latest
    environment: live-tests
    timeout-minutes: 20
    defaults:
      run:
        working-directory: plugins/github
    steps:
      # The suite creates and deletes repositories, so this token belongs to a
      # dedicated test account, never a person's or the organisation's.
      - name: Require the test account's token
        env:
          TOKEN: ${{ secrets.GITHUB_TEST_ACCOUNT_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::GITHUB_TEST_ACCOUNT_TOKEN is not set in the live-tests environment."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Run the deploy suite against the GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TEST_ACCOUNT_TOKEN }}
          GITHUB_E2E_TEST: "1"
          INCLUDE_E2E: "1"
        run: npx vitest run --project e2e e2e/deploy-api.test.ts
