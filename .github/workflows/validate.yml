name: validate

# PR gate. This workflow runs UNTRUSTED contributor code (dependency installs,
# esbuild, plugin tests), so it is deliberately powerless:
#   - `pull_request`, never `pull_request_target` (fork PRs get no secrets)
#   - read-only token, no secrets referenced anywhere
#   - installs run with --ignore-scripts (verified compatible with esbuild,
#     which resolves its platform binary via optionalDependencies)
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect:
    name: detect changed plugins
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.detect.outputs.plugins }}
      any: ${{ steps.detect.outputs.any }}
      revocations: ${{ steps.detect.outputs.revocations }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: detect
        name: List changed plugin directories
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # A publishable plugin is exactly `plugins/<id>/`. That is the whole
          # rule — everything in this repository is published, so there is
          # nothing to exclude and no top-level file can be mistaken for a
          # package.
          #
          # The manifest check that follows is not a second identity rule — it
          # drops a directory that the PR *deleted*, which still shows up in the
          # diff. themes/ gets its own detect when theme validation lands (R4).
          selected=$(git diff --name-only "$BASE_SHA"...HEAD \
            | awk -F/ '$1 == "plugins" && NF >= 2 { print $1 "/" $2 }' | sort -u \
            | while IFS= read -r dir; do
                if [ -f "$dir/assets/manifest.json" ]; then
                  printf '%s\n' "$dir"
                fi
              done)
          if [ -z "$selected" ]; then
            echo "No plugin directories touched."
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "plugins=[]" >> "$GITHUB_OUTPUT"
          else
            printf 'Changed plugins:\n%s\n' "$selected"
            json=$(printf '%s\n' "$selected" | jq -R . | jq -sc .)
            echo "any=true" >> "$GITHUB_OUTPUT"
            echo "plugins=$json" >> "$GITHUB_OUTPUT"
          fi

          # revoked.json is not inside any plugin directory, so it used to fall
          # through every filter above and land in a PR with no checks at all —
          # the one file whose mistakes are silent on the client.
          if git diff --name-only "$BASE_SHA"...HEAD | grep -qx 'registry/revoked.json'; then
            echo "registry/revoked.json changed."
            echo "revocations=true" >> "$GITHUB_OUTPUT"
          else
            echo "revocations=false" >> "$GITHUB_OUTPUT"
          fi

  validate:
    name: ${{ matrix.plugin }}
    needs: detect
    if: needs.detect.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.detect.outputs.plugins) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags: the validator compares against released versions

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install (no lifecycle scripts)
        working-directory: ${{ matrix.plugin }}
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build from source
        working-directory: ${{ matrix.plugin }}
        run: npm run build

      - name: Test (unit scope only)
        working-directory: ${{ matrix.plugin }}
        run: |
          # Run the UNIT scope, not the full `test`. A plugin's full suite may
          # include features/e2e/integration projects that hit a live service,
          # need a real browser, or need the moss binary — none of which this
          # powerless gate has (matters' features/e2e call the live Matters API).
          # test:unit is the deterministic subset, matching the monorepo's own
          # plugin CI scope.
          if node -e "process.exit(require('./package.json').scripts?.['test:unit'] ? 0 : 1)"; then
            npm run test:unit
          elif node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            echo "::warning::${{ matrix.plugin }} has no test:unit script; running full test — it must not depend on a browser, network, or the moss binary"
            npm test
          else
            echo "No test script; skipping."
          fi

      # dist/ is gitignored, so what ships is always built here from the source
      # under review — there is no committed build that could drift from it.
      - name: Validate against registry rules
        run: node .github/scripts/validate-plugin.mjs "${{ matrix.plugin }}"

  revocations:
    name: revoked.json
    needs: detect
    if: needs.detect.outputs.revocations == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check the change against the file it replaces
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # The serial rule is relative, so the outgoing file is half the input.
          # A file being added for the first time has no base to compare to.
          if git cat-file -e "${BASE_SHA}:registry/revoked.json" 2>/dev/null; then
            git show "${BASE_SHA}:registry/revoked.json" > /tmp/revoked-base.json
            node .github/scripts/validate-revocations.mjs /tmp/revoked-base.json registry/revoked.json
          else
            node .github/scripts/validate-revocations.mjs --new registry/revoked.json
          fi

  scripts:
    name: registry scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # These decide what gets published and what gets revoked, on a repo with
      # no dependencies to test them with. Node's built-in runner needs none.
      - name: Unit tests
        run: node --test .github/scripts/*.test.mjs

  # One check with a fixed name, so branch protection has something it can
  # require. The per-plugin jobs are named after the plugin, so a rule cannot
  # name them in advance; `revoked.json` only runs when that file changes, and a
  # required check that never runs blocks a PR forever. This job always runs and
  # is the only one worth requiring.
  #
  # Skipped counts as passing — the conditional jobs above are supposed to skip.
  # Anything else (failure, cancelled) fails here.
  all-checks:
    name: all checks
    needs: [detect, validate, revocations, scripts]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have succeeded or skipped
        run: |
          set -euo pipefail
          echo '${{ toJSON(needs) }}' > needs.json
          jq -r 'to_entries[] | "  \(.key): \(.value.result)"' needs.json
          if jq -e 'all(.[]; .result == "success" or .result == "skipped")' needs.json >/dev/null; then
            echo "all checks passed"
          else
            echo "::error::one or more validation jobs did not succeed"
            exit 1
          fi
