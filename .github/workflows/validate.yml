name: validate

# PR gate. This workflow runs UNTRUSTED contributor code (dependency installs,
# esbuild, plugin tests), so it is deliberately powerless:
#   - `pull_request`, never `pull_request_target` (fork PRs get no secrets)
#   - read-only token, no secrets referenced anywhere
#   - installs run with --ignore-scripts (verified compatible with esbuild,
#     which resolves its platform binary via optionalDependencies)
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect:
    name: detect changed plugins
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.detect.outputs.plugins }}
      any: ${{ steps.detect.outputs.any }}
      revocations: ${{ steps.detect.outputs.revocations }}
      starters: ${{ steps.detect.outputs.starters }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: detect
        name: List changed plugin directories
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # A publishable plugin is exactly `plugins/<id>/`. That is the whole
          # rule — everything in this repository is published, so there is
          # nothing to exclude and no top-level file can be mistaken for a
          # package.
          #
          # The manifest check that follows is not a second identity rule — it
          # drops a directory that the PR *deleted*, which still shows up in the
          # diff. themes/ gets its own detect when theme validation lands (R4).
          #
          # Diff to the PR head, not to HEAD: the checkout is the merge commit
          # built on the current base, while base.sha is the base as of the PR's
          # last update — so base.sha...HEAD reads every push to main since then
          # as PR edits (#70 failed on #76's regenerated plugins).
          selected=$(git diff --name-only "$BASE_SHA"..."$HEAD_SHA" \
            | awk -F/ '$1 == "plugins" && NF >= 2 { print $1 "/" $2 }' | sort -u \
            | while IFS= read -r dir; do
                if [ -f "$dir/assets/manifest.json" ]; then
                  printf '%s\n' "$dir"
                fi
              done)
          if [ -z "$selected" ]; then
            echo "No plugin directories touched."
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "plugins=[]" >> "$GITHUB_OUTPUT"
          else
            printf 'Changed plugins:\n%s\n' "$selected"
            json=$(printf '%s\n' "$selected" | jq -R . | jq -sc .)
            echo "any=true" >> "$GITHUB_OUTPUT"
            echo "plugins=$json" >> "$GITHUB_OUTPUT"
          fi

          # revoked.json is not inside any plugin directory, so it used to fall
          # through every filter above and land in a PR with no checks at all —
          # the one file whose mistakes are silent on the client.
          if git diff --name-only "$BASE_SHA"..."$HEAD_SHA" | grep -qx 'registry/revoked.json'; then
            echo "registry/revoked.json changed."
            echo "revocations=true" >> "$GITHUB_OUTPUT"
          else
            echo "revocations=false" >> "$GITHUB_OUTPUT"
          fi

          # Starters live outside plugins/, so like revoked.json they would
          # otherwise land in a PR with no checks. The scripts that cut, check
          # and pack them are part of what a starter is, so they count too.
          if git diff --name-only "$BASE_SHA"..."$HEAD_SHA" | grep -qE '^(starters|scripts)/'; then
            echo "starters or their scripts changed."
            echo "starters=true" >> "$GITHUB_OUTPUT"
          else
            echo "starters=false" >> "$GITHUB_OUTPUT"
          fi

  validate:
    name: ${{ matrix.plugin }}
    needs: detect
    if: needs.detect.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.detect.outputs.plugins) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags: the validator compares against released versions

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install (no lifecycle scripts)
        working-directory: ${{ matrix.plugin }}
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build from source
        working-directory: ${{ matrix.plugin }}
        run: npm run build

      - name: Test (unit scope only)
        working-directory: ${{ matrix.plugin }}
        run: |
          # Run the UNIT scope, not the full `test`. A plugin's full suite may
          # include features/e2e/integration projects that hit a live service,
          # need a real browser, or need the moss binary — none of which this
          # powerless gate has (matters' features/e2e call the live Matters API).
          # test:unit is the deterministic subset, matching the monorepo's own
          # plugin CI scope.
          if node -e "process.exit(require('./package.json').scripts?.['test:unit'] ? 0 : 1)"; then
            npm run test:unit
          elif node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            echo "::warning::${{ matrix.plugin }} has no test:unit script; running full test — it must not depend on a browser, network, or the moss binary"
            npm test
          else
            echo "No test script; skipping."
          fi

      # dist/ is gitignored, so what ships is always built here from the source
      # under review — there is no committed build that could drift from it.
      - name: Validate against registry rules
        run: node .github/scripts/validate-plugin.mjs "${{ matrix.plugin }}"

  revocations:
    name: revoked.json
    needs: detect
    if: needs.detect.outputs.revocations == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check the change against the file it replaces
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # The serial rule is relative, so the outgoing file is half the input.
          # A file being added for the first time has no base to compare to.
          if git cat-file -e "${BASE_SHA}:registry/revoked.json" 2>/dev/null; then
            git show "${BASE_SHA}:registry/revoked.json" > /tmp/revoked-base.json
            node .github/scripts/validate-revocations.mjs /tmp/revoked-base.json registry/revoked.json
          else
            node .github/scripts/validate-revocations.mjs --new registry/revoked.json
          fi

  # Starters are sites, not code moss runs, so there is nothing of ours to
  # build: the checks are static (manifest, posters, the guarantees every site/
  # makes) plus the version rule. They are also built and packed here, with the
  # same hash-pinned moss binary the publish workflow uses, so a starter that
  # builds on a maintainer's machine but not on Linux fails on the PR instead of
  # on main.
  #
  # This job executes a downloaded binary. It is safe to do so because the
  # binary is fixed by the sha256 in starters/moss.json (a PR that changes that
  # pin is visible in its own diff) and because the job's token is read-only:
  # nothing from the PR is given write access to anything.
  starters:
    name: starters
    needs: detect
    if: needs.detect.outputs.starters == 'true'
    runs-on: ubuntu-latest
    # Bounds a hung build; the same limit as the publish job.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch the pinned moss (sha256-verified)
        id: moss
        run: echo "path=$(scripts/fetch-moss.sh)" >> "$GITHUB_OUTPUT"

      - name: Check starters against the contract, and build them
        env:
          MOSS: ${{ steps.moss.outputs.path }}
        run: scripts/check-starters.sh

      - name: Pack starters (dry run of what publish releases)
        env:
          MOSS: ${{ steps.moss.outputs.path }}
        run: scripts/pack-starters

      # A starter that changed without a new version would be a new thing
      # under an old number, which is exactly what the version exists to
      # prevent. A starter new in this PR has nothing to compare against.
      - name: A changed starter raises its version
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-starter-versions.sh "$BASE_SHA" "$HEAD_SHA"

  # Some plugin directories are generated — first-party source copied here from
  # moss so it can be read and built like anyone else's. They are real source
  # and CI builds them for real; what they are not is editable here, because the
  # next sync overwrites whatever anyone types into them.
  #
  # Driven by a `.generated` marker inside the directory rather than a list in
  # this file, so a future first-party plugin is covered the moment it is synced
  # and nobody has to remember this job exists.
  generated:
    name: generated directories
    needs: detect
    if: needs.detect.outputs.any == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse hand edits to generated plugins
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail

          # head.sha, not HEAD — see detect.
          touched=$(git diff --name-only "${BASE_SHA}"..."${HEAD_SHA}" \
            | awk -F/ '$1 == "plugins" && NF >= 2 { print $1 "/" $2 }' | sort -u \
            | while IFS= read -r dir; do
                # `if`, not `[ ... ] &&`: the latter leaves the loop — and so
                # the command substitution — exiting non-zero whenever the last
                # directory is not generated, which set -e turns into an abort.
                if [ -f "$dir/.generated" ]; then
                  printf '%s\n' "$dir"
                fi
              done)

          if [ -z "$touched" ]; then
            echo "no generated directories touched"
            exit 0
          fi

          # The sync itself is the one thing allowed to change them, and it
          # pushes a branch to this repository — a fork cannot impersonate it.
          if [ "$HEAD_REPO" = "${{ github.repository }}" ] && [ "$HEAD_REF" = "sync/first-party" ]; then
            printf 'sync updating generated directories:\n%s\n' "$touched"
            exit 0
          fi

          echo "::error::This pull request edits generated plugin directories:"
          printf '  %s\n' $touched
          echo "::error::Their source of truth is the moss repository — the next sync overwrites edits made here. Send the change to moss instead; see the .generated file in each directory."
          exit 1

  scripts:
    name: registry scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # These decide what gets published and what gets revoked, on a repo with
      # no dependencies to test them with. Node's built-in runner needs none.
      - name: Unit tests
        run: node --test .github/scripts/*.test.mjs

  # One check with a fixed name, so branch protection has something it can
  # require. The per-plugin jobs are named after the plugin, so a rule cannot
  # name them in advance; `revoked.json` only runs when that file changes, and a
  # required check that never runs blocks a PR forever. This job always runs and
  # is the only one worth requiring.
  #
  # Skipped counts as passing — the conditional jobs above are supposed to skip.
  # Anything else (failure, cancelled) fails here.
  all-checks:
    name: all checks
    needs: [detect, validate, revocations, scripts, generated, starters]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have succeeded or skipped
        run: |
          set -euo pipefail
          echo '${{ toJSON(needs) }}' > needs.json
          jq -r 'to_entries[] | "  \(.key): \(.value.result)"' needs.json
          if jq -e 'all(.[]; .result == "success" or .result == "skipped")' needs.json >/dev/null; then
            echo "all checks passed"
          else
            echo "::error::one or more validation jobs did not succeed"
            exit 1
          fi
