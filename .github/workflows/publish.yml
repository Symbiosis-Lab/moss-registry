name: publish

# What makes a merged plugin installable.
#
# Two steps that must not be split: cut any missing releases, then regenerate
# the index from the releases that now exist. Tag existence is the only state
# this workflow keeps, so re-running a red run is the entire recovery procedure.
#
# Unlike validate.yml, this runs on reviewed code that a maintainer merged, so
# it is allowed a write token. It still installs with --ignore-scripts, both to
# match the artifact validate.yml built from the same source and because a
# lockfile is a large surface to trust with a token that can publish.
on:
  push:
    branches: [main]
  # Deliberately NOT `release: published`, which reads like the obvious trigger
  # for "moss pushed a first-party artifact" and cannot work. A release event
  # runs with github.ref set to the *tag*, and the github-pages environment only
  # accepts deployments from main — so the deploy job is rejected at environment
  # gating before a single step runs, producing a failed run with no logs to
  # explain it. Tried on 2026-07-28; runs 30333789782 and 30333791769.
  #
  # Keeping the environment restricted to main is worth more than the
  # convenience: it means the bytes moss trusts can only ever be deployed by a
  # run on the reviewed default branch.
  #
  # So moss signals explicitly, via repository_dispatch rather than by
  # triggering this workflow directly. Two reasons, both load-bearing:
  # repository_dispatch always runs on the default branch, which is what the
  # environment requires; and creating one needs only contents:write, which the
  # token already has because it creates the releases. Dispatching a workflow
  # would additionally need actions:write — the token does not have it, and
  # widening a cross-repo publishing token to satisfy a trigger choice is the
  # wrong direction.
  repository_dispatch:
    types: [publish-index]
  workflow_dispatch:
  # Weekly, to move the catalog's expiry date forward and re-sign it. It cuts
  # no releases: a plugin that will not build must not stop the re-signing,
  # or installs would stop everywhere when the date passed.
  schedule:
    - cron: "23 6 * * 1"

# Runs serialize. Two merges landing together must not race to build the same
# index, and cancelling a half-finished publish would leave releases without
# index entries.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: cut missing releases
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags are the version record

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build and release every plugin whose tag is missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          published=0
          for dir in plugins/*/; do
            dir="${dir%/}"
            id="$(basename "$dir")"
            manifest="$dir/assets/manifest.json"
            [ -f "$manifest" ] || { echo "$id: no assets/manifest.json, skipping"; continue; }

            # No entry means a program-only plugin, which the `native-*`
            # jobs build; there is no bundle for this job to make.
            if ! jq -e '(.entry // "") != ""' "$manifest" >/dev/null; then
              echo "$id: native plugin, released by the native job"
              continue
            fi

            version="$(jq -r '.version' "$manifest")"
            tag="${id}-v${version}"

            # Tag existence is the idempotence check: a docs-only merge, a
            # re-run, and a merge that bumped nothing all reach here and stop.
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "$id: $tag already released"
              continue
            fi

            echo "::group::$id -> $tag"
            ( cd "$dir" && npm ci --ignore-scripts --no-audit --no-fund && npm run build )

            # The artifact is the flat contents of dist/ — manifest.json,
            # the bundle, and the icon — because that is what moss extracts
            # into .moss/plugins/<id>/.
            zip_name="${id}-${version}.zip"
            ( cd "$dir/dist" && zip -qr "$GITHUB_WORKSPACE/$zip_name" . )

            files=("$zip_name")

            # The icon rides along as its own asset so the catalog can show it
            # before anything is installed, without reaching for a second origin.
            icon="$(jq -r '.icon // "icon.svg"' "$manifest")"
            if [ -f "$dir/dist/$icon" ]; then
              icon_asset="${id}-${version}-icon.${icon##*.}"
              cp "$dir/dist/$icon" "$icon_asset"
              files+=("$icon_asset")
            else
              echo "::warning::$id declares icon \"$icon\" but dist/ has no such file; publishing without one"
            fi

            gh release create "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" \
              --latest=false \
              --title "$id $version" \
              --notes "Built from \`$dir\` at ${GITHUB_SHA}. See the plugin's CHANGELOG.md for what changed."
            echo "::endgroup::"
            published=$((published + 1))
          done

          echo "released $published package(s)"

  # Starters are released here, in a job of their own, and nothing in the plugin
  # job above knows about them. It has no `needs`, so a plugin failure does not
  # stop starters from being cut, and (below) a starter failure does not stop
  # the index from deploying: the index and revoked.json carry every installed
  # app's catalog and kill list, and a starter must never be able to hold those
  # back. A released starter version is final: a tag that exists is never touched.
  #
  # The timeout exists so the index job is never left waiting on a hung starters
  # job. A job that hits its timeout reports `failure` to `needs.starters.result`
  # (`cancelled` is only for a cancelled run), which the index condition below
  # tolerates, so the index still deploys.
  starters:
    name: cut missing starter releases
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags are the version record

      - name: Pack and release every starter whose tag is missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          # One starter failing must not stop the others, so failures are
          # counted and the job fails at the end, not at the first.
          moss=""
          failed=0
          published=0
          for dir in starters/*/; do
            dir="${dir%/}"
            id="$(basename "$dir")"
            manifest="$dir/manifest.json"
            [ -f "$manifest" ] || { echo "$id: no manifest.json, skipping"; continue; }

            version="$(jq -r '.version' "$manifest")"
            tag="starter-${id}-v${version}"

            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "$id: $tag already released"
              continue
            fi

            echo "::group::$id -> $tag"
            # The pinned moss (starters/moss.json), downloaded once and
            # sha256-verified. Without it no preview can be built, and a
            # release without its preview would be final, so stop here.
            if [ -z "$moss" ]; then
              if ! moss="$(scripts/fetch-moss.sh)"; then
                echo "::error::could not fetch the pinned moss; no starter can be released"
                echo "::endgroup::"
                failed=1
                break
              fi
            fi

            if ! MOSS="$moss" scripts/pack-starters "$id"; then
              echo "::error::$id: packing failed"
              echo "::endgroup::"
              failed=1
              continue
            fi

            files=("dist/starters/${id}-${version}.zip" "dist/starters/${id}-${version}-preview.zip" "dist/starters/${id}-${version}.json" "dist/starters/${id}-${version}-poster-light.jpg" "dist/starters/${id}-${version}-poster-dark.jpg")
            missing=0
            for f in "${files[@]}"; do [ -f "$f" ] || { echo "::error::$id: pack produced no $f"; missing=1; }; done
            if [ "$missing" = 1 ]; then
              echo "::endgroup::"
              failed=1
              continue
            fi

            if gh release create "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" \
                 --latest=false \
                 --title "$id $version" \
                 --notes "Built from \`$dir\` at ${GITHUB_SHA}. See starters/README.md for what a starter contains."; then
              published=$((published + 1))
            else
              echo "::error::$id: gh release create failed"
              failed=1
            fi
            echo "::endgroup::"
          done

          echo "released $published starter(s)"
          exit "$failed"

  # Plugins that are only a manifest plus a native program are built by each
  # plugin's own native/build-<platform>.sh, on a runner of each platform the
  # manifest declares, with a read-only token: the build script is the
  # contributor's code. Like starters these are jobs of their own with a
  # timeout, so a slow or failing build can neither stop the JavaScript plugins
  # from being released nor hold back the index.
  #
  # The release carries the archives next to the zip, and the zip's manifest pins
  # each archive's sha256 and URL. The index builder re-downloads the archives
  # and refuses an entry whose pins do not match, so a release that is only
  # half uploaded fails the run loudly instead of publishing a plugin that
  # cannot work. A released version is final, as everywhere else.
  native-plan:
    name: plan native plugin releases
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.plan.outputs.plugins }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - id: plan
        name: List native plugins whose release tag is missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          todo=()
          for dir in plugins/*/; do
            dir="${dir%/}"
            manifest="$dir/assets/manifest.json"
            [ -f "$manifest" ] || continue
            if jq -e '(.entry // "") != ""' "$manifest" >/dev/null; then continue; fi
            tag="$(basename "$dir")-v$(jq -r '.version' "$manifest")"
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "$dir: $tag already released"
            else
              echo "$dir: $tag to release"
              todo+=("$dir")
            fi
          done
          echo "plugins=${todo[*]}" >> "$GITHUB_OUTPUT"
          echo "matrix=$(node .github/scripts/native-matrix.mjs "${todo[@]}")" >> "$GITHUB_OUTPUT"

  native-build:
    name: build ${{ matrix.id }} (${{ matrix.platform }})
    needs: native-plan
    if: needs.native-plan.outputs.matrix != '[]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.native-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      # native/vendor/<platform>/ is kept between runs; see validate.yml.
      - uses: actions/cache@v4
        with:
          path: ${{ matrix.plugin }}/native/vendor/${{ matrix.platform }}
          key: native-${{ matrix.id }}-${{ matrix.platform }}-${{ matrix.runner }}-${{ hashFiles(format('{0}/native/vendor.toml', matrix.plugin), format('{0}/native/scripts/**', matrix.plugin), format('{0}/native/build-*.sh', matrix.plugin)) }}

      - name: Build and run the ${{ matrix.platform }} program
        env:
          PLUGIN: ${{ matrix.plugin }}
          PLATFORM: ${{ matrix.platform }}
        run: scripts/pack-native-plugin "$PLUGIN" --platform "$PLATFORM" --out "$RUNNER_TEMP/archive"

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.id }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/archive/*
          retention-days: 7

  native:
    name: cut missing native plugin releases
    needs: [native-plan, native-build]
    # Also after a failed build: the other plugins' releases still go out, and a
    # plugin missing an archive fails in the pack step below.
    if: always() && needs.native-plan.outputs.plugins != '' && needs.native-build.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        continue-on-error: true # every build failed: each plugin below then fails by name
        with:
          pattern: native-*
          merge-multiple: true
          path: ${{ runner.temp }}/archives

      - name: Pack and release every planned native plugin
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGINS: ${{ needs.native-plan.outputs.plugins }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/archives"

          # One plugin failing must not stop the others.
          failed=0
          published=0
          for dir in $PLUGINS; do
            id="$(basename "$dir")"
            version="$(jq -r '.version' "$dir/assets/manifest.json")"
            tag="${id}-v${version}"

            echo "::group::$id -> $tag"
            out="$RUNNER_TEMP/native-$id"
            if ! scripts/pack-native-plugin "$dir" --prebuilt "$RUNNER_TEMP/archives" --out "$out" --repo "$GITHUB_REPOSITORY"; then
              echo "::error::$id: packing failed (a platform's build failed or is missing)"
              echo "::endgroup::"
              failed=1
              continue
            fi

            files=("$out"/*)
            if gh release create "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" \
                 --latest=false \
                 --title "$id $version" \
                 --notes "Built from \`$dir\` at ${GITHUB_SHA}. See the plugin's README.md for what it does."; then
              published=$((published + 1))
            else
              echo "::error::$id: gh release create failed"
              # A release left half-uploaded would be indexed as final and fail
              # the index; removing it (the tag stays) lets a re-run retry.
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes || true
              failed=1
            fi
            echo "::endgroup::"
          done

          echo "released $published native plugin(s)"
          exit "$failed"

  index:
    name: index
    # Always: the index must be regenerated even when nothing new was cut, since
    # a dispatch from moss arrives without this repo changing at all, and the
    # weekly schedule exists only to move the catalog's expiry date forward.
    #
    # Runs when the plugin release job did not fail, exactly as before starters
    # existed. The native and starters jobs are waited for (so a starter cut in this run is
    # indexed in this run) but its failure or skip is tolerated: only a
    # cancelled run stops here. A starters job that timed out reports `failure`,
    # so it is tolerated like any other starter failure. The index builder treats starters as optional
    # too, so a starter problem can never keep index.json or revoked.json from
    # deploying.
    #
    # This job never sees the signing key: it hands the unsigned documents to
    # `sign`. Whatever it produces gets signed, though, so its actions are
    # pinned by commit like the sign job's.
    needs: [release, native, starters]
    if: always() && needs.release.result != 'failure' && needs.native.result != 'cancelled' && needs.starters.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Generate index.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p public
          # serial is the run number: monotonic, and clients reject anything
          # lower than the highest they have seen. Renaming or recreating this
          # workflow file resets it, which would strand every client on the
          # last-known-good copy — don't.
          node .github/scripts/build-index.mjs --serial "${{ github.run_number }}" --out public/index.json
          cat public/index.json

      - name: Stage revoked.json alongside it
        run: |
          set -euo pipefail
          # Deployed from the repo, not generated: revocations are hand-written
          # and reviewed. Clients fetch both from the one pinned origin.
          cp registry/revoked.json public/revoked.json

      # moss offers no installs from a catalog past this date, so an origin
      # cannot freeze apps on an old copy to hide a newer kill list. The
      # weekly run moves it forward; revoked.json keeps its hand-written
      # serial, which clients accept again at the same serial.
      - name: Stamp the expiry date
        run: |
          set -euo pipefail
          for f in public/index.json public/revoked.json; do
            node .github/scripts/catalog-signing.mjs stamp "$f" --days 21
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: catalog-unsigned
          path: public
          retention-days: 7

  # The only job that can read the signing key. It runs no code from this
  # repository and no action by tag: it takes the documents `index` built,
  # signs them with Ubuntu's minisign, and passes them on. Its environment
  # accepts only main, like github-pages.
  #
  # A missing key fails this job, and `deploy` runs only when it succeeds, so
  # nothing unsigned reaches either address.
  sign:
    name: sign
    needs: index
    if: always() && needs.index.result == 'success'
    runs-on: ubuntu-latest
    environment: catalog-signing
    permissions: {}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: catalog-unsigned
          path: public

      - name: Install minisign
        run: |
          set -euo pipefail
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq minisign >/dev/null

      - name: Sign index.json and revoked.json
        env:
          SIGNING_KEY: ${{ secrets.MOSS_REGISTRY_SIGNING_KEY }}
          SERIAL: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEY}" ]; then
            echo "::error::MOSS_REGISTRY_SIGNING_KEY is empty in the catalog-signing environment; refusing to publish an unsigned catalog"
            exit 1
          fi
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SIGNING_KEY" > "$key"
          for f in index.json revoked.json; do
            minisign -S -s "$key" -m "public/$f" -t "moss-registry $f, publish run ${SERIAL}"
          done
          ls -l public

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: catalog
          path: public
          retention-days: 7

  deploy:
    name: deploy
    needs: sign
    if: always() && needs.sign.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the index release below
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: catalog
          path: public

      # The same check moss makes, against the same keys: a document without a
      # valid signature by a key in registry/keys/ stops here instead of
      # reaching apps that would refuse it.
      - name: Check the signatures against the pinned keys
        run: node .github/scripts/catalog-signing.mjs check public --keys registry/keys

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v4

      # A second address for the same files: moss reads
      # releases/latest/download/{index,revoked}.json(.minisig) when Pages is
      # unreachable. "Latest" must always be the newest index release, so a
      # new release is created and marked latest, never an asset replaced on
      # an existing one: `gh release upload --clobber` deletes before it
      # uploads, which leaves a window where the URL 404s. Plugin, native and
      # starter releases are made with --latest=false so none of them can take
      # the badge.
      #
      # One release per attempt, never a gap filled in an earlier one: a
      # re-run stamps a new date, so its documents differ from the first
      # attempt's and only its own signatures match them.
      #
      # Uploads public/, the very files given to Pages, not a rebuild.
      - name: Publish the same files as the Latest release
        env:
          GH_TOKEN: ${{ github.token }}
          SERIAL: ${{ github.run_number }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          tag="index-${SERIAL}"
          [ "$ATTEMPT" = 1 ] || tag="index-${SERIAL}-${ATTEMPT}"

          gh release create "$tag" public/index.json public/revoked.json public/index.json.minisig public/revoked.json.minisig --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --latest \
            --title "Registry index ${SERIAL}" \
            --notes "The catalog documents deployed by publish run ${SERIAL}, as a second address to Pages. Only the newest few of these are kept."

      # Tags are immutable (the "release tags are immutable" ruleset), so this
      # removes the release objects and leaves their tags. Housekeeping only:
      # continue-on-error keeps a failure here from failing the job, which
      # would skip `verify`.
      - name: Delete index releases past the newest five
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Never touch any other release.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' \
            | grep -E '^index-[0-9]+(-[0-9]+)?$' | sort -t- -k2,2nr -k3,3nr | tail -n +6 \
            | while read -r old; do
                gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes \
                  || echo "::warning::could not delete release $old"
              done

  # GitHub turns off a scheduled workflow after 60 days without activity in
  # the repository. The catalog's expiry date only moves while the schedule
  # runs, so a quiet spell would end in every app refusing new installs.
  # Re-enabling the workflow from its own scheduled run resets that clock.
  keepalive:
    name: keep the weekly schedule on
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/publish.yml/enable"

  # Reads the deployed index the way a client does and re-downloads every
  # starter zip it names, checking sha256 and size. It runs after the deploy and
  # nothing depends on it, so index.json and revoked.json are already live
  # whatever it finds; a red result here means a starter's release assets no
  # longer match the index and installs of it will fail on users' machines.
  verify:
    name: verify published starters
    needs: deploy
    if: always() && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Re-download every starter zip through the live index
        run: node .github/scripts/verify-published.mjs --index-url "https://symbiosis-lab.org/moss-registry/index.json" --serial "${{ github.run_number }}"

      # The release address must serve the same serial, and its revoked.json
      # must parse, or the fallback is a dead letter.
      - name: Re-download through the Latest release address
        run: node .github/scripts/verify-published.mjs --index-url "https://github.com/Symbiosis-Lab/moss-registry/releases/latest/download/index.json" --revoked-url "https://github.com/Symbiosis-Lab/moss-registry/releases/latest/download/revoked.json" --serial "${{ github.run_number }}"

      # Both addresses must serve signatures the pinned keys accept, or apps
      # that verify keep their cached catalog.
      - name: Check the signatures at both addresses
        run: |
          set -euo pipefail
          # A new .minisig path can be a cached 404 for a few minutes after the deploy.
          for base in "https://symbiosis-lab.org/moss-registry" "https://github.com/Symbiosis-Lab/moss-registry/releases/latest/download"; do
            try=1
            until node .github/scripts/catalog-signing.mjs check-url "$base" --keys registry/keys; do
              [ "$try" -lt 5 ] || exit 1
              try=$((try + 1))
              sleep 30
            done
          done
