# Inputs to the OCR fingerprint, whose first two parts are the lines
# `tesseract 5.5.4` and ` leptonica-1.87.0` of `tesseract --version`. On macOS,
# package-macos.py refuses any other Homebrew tesseract; on Linux,
# package-linux.sh builds both from these sources. Both ship this traineddata
# (tessdata_fast 4.1.0, byte-identical to Homebrew's), so every build reads a
# page the same way and a new release keeps a site's cached readings.
[tesseract]
version = "5.5.4"
url = "https://github.com/tesseract-ocr/tesseract/archive/refs/tags/5.5.4.tar.gz"
sha256 = "a8dbf8b8c8ee427ff6ad1d99116502feaf59440af1adb893caf60a6576826cf4"

