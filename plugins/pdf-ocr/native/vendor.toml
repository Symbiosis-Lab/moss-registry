# Inputs to the OCR fingerprint, whose first two parts are the lines
# `tesseract 5.5.3` and ` leptonica-1.87.0` of `tesseract --version`.
# scripts/package.sh builds both from these sources on every platform and ships
# this traineddata (tessdata_fast 4.1.0), so every build reads a page the same
# way and a new release keeps a site's cached readings. Moving either pin redoes
# every cached reading.
[tesseract]
version = "5.5.3"
url = "https://github.com/tesseract-ocr/tesseract/archive/refs/tags/5.5.3.tar.gz"
sha256 = "9218e62793116d42a9f6d14cd9348518b27f382096eea3d0f2d1a24616bb5884"

[leptonica]
version = "1.87.0"
url = "https://github.com/DanBloomberg/leptonica/releases/download/1.87.0/leptonica-1.87.0.tar.gz"
sha256 = "c73363397f96eb1295602bf44d708a994ad42046c791bf03ea0505d829bdb6a7"

# macOS only: leptonica reads pdf-ocr's PNG pages through it (Linux links the
# distribution's static libpng; zlib comes with both systems).
[libpng]
version = "1.6.59"
url = "https://github.com/pnggroup/libpng/archive/refs/tags/v1.6.59.tar.gz"
sha256 = "2540302a1844ad2b2b501977abecfa850f265f97b78f065a712ab4074a89f5b5"

[eng-traineddata]
